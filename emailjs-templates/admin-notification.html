<!--
  EmailJS TEMPLATE: Admin Notification
  ---------------------------------------------------------------
  Paste this whole file into EmailJS Dashboard > Email Templates >
  (create new) > toggle to the "Code" / "</>" view, then paste here.

  Template settings in the EmailJS dashboard:
    - To email:      workwithjigar@gmail.com   (type it directly, NOT a variable)
    - From name:     WorkWithJigar Site
    - Reply To:      {{from_email}}
    - Subject:       New inquiry from {{from_name}} — WorkWithJigar.in

  Variables used below: {{from_name}}, {{from_email}}, {{message}}
  (from the contact form, {{from_name}} is the visitor's name;
   from the case-study popup, {{from_name}} is their email address
   since that form only collects an email.)
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0e17;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#111827;border:1px solid #1e293b;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background-color:#0a0e17;padding:24px 32px;border-bottom:1px solid #1e293b;">
            <span style="font-size:18px;font-weight:bold;color:#f1f5f9;">WorkWith<span style="color:#3b82f6;">Jigar</span></span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <p style="margin:0 0 4px;font-size:12px;font-weight:bold;letter-spacing:0.08em;text-transform:uppercase;color:#22c55e;">New Inquiry</p>
            <h1 style="margin:0 0 20px;font-size:22px;line-height:1.3;color:#f1f5f9;">You've got a new message from your site</h1>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
              <tr>
                <td style="padding:10px 0;border-bottom:1px solid #1e293b;font-size:13px;color:#64748b;">Name</td>
                <td style="padding:10px 0;border-bottom:1px solid #1e293b;font-size:14px;color:#f1f5f9;text-align:right;">{{from_name}}</td>
              </tr>
              <tr>
                <td style="padding:10px 0;border-bottom:1px solid #1e293b;font-size:13px;color:#64748b;">Email</td>
                <td style="padding:10px 0;border-bottom:1px solid #1e293b;font-size:14px;text-align:right;">
                  <a href="mailto:{{from_email}}" style="color:#3b82f6;text-decoration:none;">{{from_email}}</a>
                </td>
              </tr>
            </table>

            <p style="margin:0 0 8px;font-size:13px;color:#64748b;">Message</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0f1523;border:1px solid #1e293b;border-radius:10px;">
              <tr>
                <td style="padding:16px;font-size:14px;line-height:1.6;color:#cbd5e1;">{{message}}</td>
              </tr>
            </table>

            <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:28px;">
              <tr>
                <td style="border-radius:999px;background-color:#2563eb;">
                  <a href="mailto:{{from_email}}" style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">Reply to {{from_name}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;background-color:#060911;border-top:1px solid #1e293b;">
            <p style="margin:0;font-size:12px;color:#64748b;">Sent automatically from the contact form on workwithjigar.in</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
